<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora con Switch</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 300px;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #007bff;
            color: white;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }
        button:hover {
            background-color: #0056b3;
        }
        .resultado {
            margin-top: 15px;
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Calculadora Básica</h2>
        
        <input type="number" id="num1" placeholder="Primer número">
        
        <select id="operacion">
            <option value="suma">Suma (+)</option>
            <option value="resta">Resta (-)</option>
            <option value="multiplicacion">Multiplicación (*)</option>
            <option value="division">División (/)</option>
        </select>
        
        <input type="number" id="num2" placeholder="Segundo número">
        
        <button onclick="calcular()">Calcular</button>
        
        <div class="resultado" id="resultado">Resultado: -</div>
    </div>

    <script>
        function calcular() {
            // Obtener los valores de los inputs
            let num1 = parseFloat(document.getElementById('num1').value);
            let num2 = parseFloat(document.getElementById('num2').value);
            let operacion = document.getElementById('operacion').value;
            let resultadoDiv = document.getElementById('resultado');

            // Validar que se hayan ingresado números válidos
            if (isNaN(num1) || isNaN(num2)) {
                resultadoDiv.textContent = "Por favor, ingresa números válidos.";
                return;
            }

            let resultado;

            // Estructura switch para procesar la operación
            switch (operacion) {
                case 'suma':
                    resultado = num1 + num2;
                    break;

                case 'resta':
                    resultado = num1 - num2;
                    break;

                case 'multiplicacion':
                    resultado = num1 * num2;
                    break;

                case 'division':
                    if (num2 === 0) {
                        resultado = "Error: No se puede dividir entre 0";
                    } else {
                        resultado = num1 / num2;
                    }
                    break;

                default:
                    resultado = "Operación no válida";
                    break;
            }

            // Mostrar el resultado en pantalla
            resultadoDiv.textContent = `Resultado: ${resultado}`;
        }
    </script>

</body>
</html>
